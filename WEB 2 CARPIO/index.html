<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>CARPIO WEB2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>JavaScript Dialog Boxes</h1>
        <p>Click each button to demonstrate the three JavaScript dialog boxes.</p>

        <div class="buttons">
            <button class="alert-btn" onclick="showAlert()">Alert</button>
            <button class="confirm-btn" onclick="showConfirm()">Confirm</button>
            <button class="prompt-btn" onclick="showPrompt()">Prompt</button>
        </div>

        <div id="result">Result will appear here.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
